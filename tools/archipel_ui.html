<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Archipel</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="https://unpkg.com/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root {
    --mer: #0d1b2a;        /* fond */
    --creux: #101f30;      /* panneaux */
    --plage: #16293f;      /* éléments internes */
    --fil: #23384e;        /* bordures */
    --ecume: #dce8f5;      /* texte principal */
    --brume: #8fa3b8;      /* texte secondaire */
    --lune: #7d8fa3;       /* texte atténué */
    --or: #ffd54f;         /* accent actif */
    --sable: #e8a13c;      /* accent couvée */
    --corail: #ff8a80;     /* erreur */
    --idee: #ffd54f; --note: #7ec8e3; --source: #7fd4a8; --capture: #c39bd3;
    --projet: #a0aec0; --chantier: #f0b27a; --ordonnance: #e8a13c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--mer); color: var(--ecume);
    font-family: "Segoe UI", system-ui, sans-serif; }

  /* ---------- barre supérieure ---------- */
  #bar { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 10;
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    background: color-mix(in srgb, var(--mer) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--fil); }
  #bar .logo { font-size: 17px; font-weight: 600; letter-spacing: .02em;
    color: var(--ecume); user-select: none; }
  #bar .logo span { color: var(--or); }
  #bar label { color: var(--brume); font-size: 13px; }
  select, input[type=search], input[type=text], textarea {
    background: var(--creux); color: var(--ecume);
    border: 1px solid var(--fil); border-radius: 8px;
    font-family: inherit; font-size: 14px; }
  select { padding: 7px 10px; color: var(--or); }
  input[type=search] { padding: 7px 12px; width: 290px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--or); }
  #stat { font-size: 13px; color: var(--brume); margin-left: auto; }
  .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--fil);
    background: var(--creux); color: var(--ecume); font-size: 13.5px;
    cursor: pointer; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--brume); }
  .btn.primaire { border-color: var(--or); color: var(--or); }
  .btn.primaire:hover { background: color-mix(in srgb, var(--or) 12%, var(--creux)); }
  .btn.actif { background: var(--or); color: var(--mer); border-color: var(--or); }
  .btn.mini { padding: 3px 9px; font-size: 12px; border-radius: 6px; }

  /* ---------- carte ---------- */
  #net { position: fixed; inset: 56px 0 0 0; }
  #mode { position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 9; padding: 9px 18px; border-radius: 999px;
    background: var(--or); color: var(--mer); font-size: 13.5px; font-weight: 600;
    box-shadow: 0 4px 18px rgba(0,0,0,.4); display: none; }
  #mode.on { display: block; }

  /* ---------- panneau latéral ---------- */
  #panel { position: fixed; top: 56px; right: 0; bottom: 0; width: 460px; z-index: 8;
    background: var(--creux); border-left: 1px solid var(--fil);
    transform: translateX(102%); transition: transform .2s ease;
    display: flex; flex-direction: column; }
  #panel.ouvert { transform: translateX(0); }
  #panel header { padding: 14px 18px 10px; border-bottom: 1px solid var(--fil); }
  #ptitre { font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600;
    font-family: Georgia, "Times New Roman", serif; }
  #pmeta { display: flex; gap: 8px; align-items: center; margin-top: 8px;
    color: var(--brume); font-size: 12px; flex-wrap: wrap; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid var(--fil); color: var(--ecume); }
  .badge.idee { border-color: var(--idee); color: var(--idee); }
  .badge.note { border-color: var(--note); color: var(--note); }
  .badge.source { border-color: var(--source); color: var(--source); }
  .badge.capture { border-color: var(--capture); color: var(--capture); }
  .badge.projet, .badge.chantier { border-color: var(--projet); color: var(--projet); }
  .badge.ordonnance { border-color: var(--ordonnance); color: var(--ordonnance); }
  .badge.ord-preparee { border-color: var(--brume); color: var(--brume); }
  .badge.ord-signee { border-color: var(--or); color: var(--or); }
  .badge.ord-confiee { border-color: var(--source); color: var(--source); }

  /* ---------- widgets d'ordonnance ---------- */
  .wcart { border: 1px solid var(--fil); border-radius: 10px;
    background: var(--creux); padding: 12px 14px; margin: 10px 0; }
  .wcart .wtype { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--brume); margin-bottom: 6px; }
  .wcart .wtype b { color: var(--or); font-weight: 600; }
  .wcart .wcite { font-family: Georgia, serif; font-size: 14.5px; line-height: 1.5;
    color: var(--ecume); }
  .wcart .wnote { font-size: 12.5px; color: var(--brume); margin-top: 7px; }
  .wcart.erree { border-color: var(--corail); }
  .wcart .wlien { color: var(--note); cursor: pointer; text-decoration: none; }
  .wcart .wlien:hover { text-decoration: underline; }
  .wcode { border: 1px solid var(--fil); border-radius: 10px; background: var(--creux);
    margin: 10px 0; overflow: hidden; }
  .wcode .whead { padding: 8px 14px; font-size: 12.5px; color: var(--brume);
    border-bottom: 1px solid var(--fil); display: flex; gap: 10px; align-items: baseline; }
  .wcode .whead b { color: var(--or); font-weight: 600; }
  .wcode .wscroll { max-height: 460px; overflow: auto; }
  .wcode table { border-collapse: collapse; width: 100%; font-family: Consolas, monospace;
    font-size: 12.5px; line-height: 1.45; }
  .wcode td.num { width: 1%; min-width: 44px; text-align: right; padding: 0 10px 0 14px;
    color: #3d5570; user-select: none; vertical-align: top; }
  .wcode td.ligne { padding: 0 14px 0 6px; white-space: pre; color: var(--ecume); }
  .wcode tr.dim td.ligne { opacity: 0.18; }
  .wcode tr.vie td.ligne { opacity: 1; }
  .wcode tr.vie td.num { color: var(--or); }
  .wcode tr.vie { background: rgba(255, 213, 79, 0.06); }
  .wcode .wzoom { padding: 7px 14px; border-top: 1px solid var(--fil);
    font-size: 12.5px; color: var(--brume); }
  .wcode .wzoom button { margin-left: 8px; }

  /* ---------- panier + compagnon ---------- */
  #panier-btn { position: fixed; right: 22px; bottom: 22px; z-index: 30;
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--fil);
    background: var(--creux); color: var(--or); font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  #panier-btn:hover { border-color: var(--or); }
  #panier-btn .nb { position: absolute; top: -4px; right: -2px; background: var(--or);
    color: var(--mer); border-radius: 999px; font-size: 11px; padding: 1px 7px;
    font-weight: 700; display: none; }
  #panier { position: fixed; right: 22px; bottom: 84px; z-index: 30; width: 380px;
    max-height: 62vh; overflow: auto; background: var(--creux);
    border: 1px solid var(--fil); border-radius: 12px; padding: 16px;
    display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #panier.on { display: block; }
  #panier h3 { margin: 0 0 10px; font-size: 15px; }
  #panier .pitem { display: flex; align-items: baseline; gap: 8px; padding: 5px 0;
    border-bottom: 1px solid var(--fil); font-size: 13px; }
  #panier .pitem .t { flex: 1; cursor: default; }
  #panier .pitem .vx { border: none; background: none; color: var(--brume); cursor: pointer; }
  #panier .pitem .vx:hover { color: var(--corail); }
  #panier textarea { width: 100%; min-height: 54px; margin: 10px 0 8px; }
  #panier .pligne { display: flex; gap: 8px; }
  #synthese .md pre { background: var(--plage); padding: 10px 12px;
    border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  #synthese .md .mermaid { background: #f4f7fb; border-radius: 8px;
    padding: 10px; margin: 10px 0; }
  .pensee { color: var(--lune); font-size: 12px; line-height: 1.45;
    border-left: 2px solid var(--fil); padding: 6px 10px; margin-bottom: 10px;
    max-height: 150px; overflow: auto; white-space: pre-wrap; }
  #pactions { display: flex; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--fil); }
  #pcorps { padding: 14px 18px 24px; overflow-y: auto; flex: 1; line-height: 1.6; }
  #pcorps::-webkit-scrollbar { width: 9px; }
  #pcorps::-webkit-scrollbar-thumb { background: var(--fil); border-radius: 5px; }

  /* rendu markdown */
  .md { font-size: 14.5px; }
  .md h1, .md h2, .md h3 { color: var(--or); font-weight: 600;
    font-family: Georgia, serif; margin: 20px 0 8px; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 15px; }
  .md p, .md ul, .md ol { margin: 8px 0; }
  .md code { background: var(--plage); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .md pre { background: var(--plage); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .md blockquote { border-left: 3px solid var(--sable); margin: 8px 0; padding: 2px 14px;
    color: var(--brume); }
  .lin { color: var(--note); cursor: pointer; text-decoration: underline dotted;
    text-underline-offset: 3px; }
  .lin:hover { color: var(--ecume); }
  mark { background: rgba(255,213,79,.35); color: inherit; border-radius: 2px; }

  /* sections de fiche */
  .sect { margin-top: 18px; }
  .sect > .titre-sect { font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--brume); margin-bottom: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 11px; border-radius: 999px; background: var(--plage);
    font-size: 13px; cursor: pointer; border: 1px solid transparent; }
  .chip:hover { border-color: var(--brume); }
  .chip.dom { cursor: default; color: var(--brume); }
  .chip.sug { border-style: dashed; border-color: var(--sable); color: var(--sable);
    display: inline-flex; gap: 6px; align-items: center; }
  .chip .vu { border: none; background: none; color: var(--ecume); cursor: pointer;
    font-size: 13px; padding: 0 2px; }
  .chip .vu:hover { color: var(--or); }
  .chip .vx { border: none; background: none; color: var(--brume); cursor: pointer;
    font-size: 13px; padding: 0 2px; }
  .chip .vx:hover { color: var(--corail); }
  .doc { display: flex; flex-direction: column; gap: 5px; }
  .doc a { color: var(--note); text-decoration: none; font-size: 13.5px; }
  .doc a:hover { text-decoration: underline; }
  .doc .livre { color: var(--brume); font-size: 13px; }
  .vide { color: var(--lune); font-size: 13px; font-style: italic; }

  /* édition */
  #form-ed { display: flex; flex-direction: column; gap: 10px; }
  #form-ed label { font-size: 12px; color: var(--brume); }
  #form-ed input[type=text] { padding: 8px 11px; }
  #form-ed textarea { min-height: 240px; padding: 10px 12px; font-size: 13.5px;
    font-family: Consolas, monospace; line-height: 1.55; resize: vertical; }
  .boutons { display: flex; gap: 8px; align-items: center; }
  #msg { font-size: 12.5px; color: var(--brume); margin-left: auto; }
  .msg-err { color: var(--corail) !important; }

  /* ---------- modal création ---------- */
  #voile { position: fixed; inset: 0; background: rgba(6,13,22,.6); z-index: 20;
    display: none; align-items: center; justify-content: center; }
  #voile.on { display: flex; }
  #modal { width: 560px; max-height: 86vh; overflow-y: auto; background: var(--creux);
    border: 1px solid var(--fil); border-radius: 14px; padding: 22px 24px;
    box-shadow: 0 12px 50px rgba(0,0,0,.5); }
  #modal h2 { margin: 0 0 14px; font-size: 17px; font-family: Georgia, serif; }
  #modal .champ { margin-bottom: 12px; }
  #modal label { display: block; font-size: 12px; color: var(--brume); margin-bottom: 5px; }
  #modal input[type=text], #modal textarea { width: 100%; padding: 9px 12px; }
  #modal textarea { min-height: 170px; font-family: Consolas, monospace;
    font-size: 13.5px; line-height: 1.55; resize: vertical; }
  #doublons-liste { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .doub { display: flex; align-items: center; gap: 10px; padding: 7px 11px;
    background: var(--plage); border-radius: 8px; font-size: 13.5px; }
  .doub .t { flex: 1; cursor: pointer; }
  .doub .t:hover { color: var(--or); }
  .doub .s { color: var(--brume); font-size: 11.5px; }

  /* toasts */
  #toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { padding: 9px 18px; border-radius: 999px; background: var(--plage);
    border: 1px solid var(--fil); font-size: 13.5px; color: var(--ecume);
    animation: fadein .2s ease; box-shadow: 0 6px 22px rgba(0,0,0,.35); }
  .toast.err { border-color: var(--corail); color: var(--corail); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>

<div id="bar">
  <span class="logo">Archipel<span>.</span></span>
  <label for="casq">chantier</label>
  <select id="casq"></select>
  <input id="q" type="search" placeholder="chercher — fiches, pages pdf… (Entrée)" autocomplete="off">
  <button class="btn" id="b-ord">Ordonnances</button>
  <button class="btn" id="b-relier">Relier</button>
  <button class="btn primaire" id="b-creer">＋ Fiche</button>
  <span id="stat"></span>
</div>

<div id="net"></div>
<div id="mode">Clique la fiche de départ, puis la fiche d'arrivée — <b>Échap</b> pour annuler</div>

<aside id="panel">
  <header>
    <h2 id="ptitre"></h2>
    <div id="pmeta"></div>
  </header>
  <div id="pactions"></div>
  <div id="pcorps"></div>
</aside>

<div id="voile">
  <div id="modal">
    <h2>Nouvelle fiche</h2>
    <div class="champ"><label>Titre — le claim, une affirmation défendable</label>
      <input type="text" id="n-titre" placeholder="ex. : Le gabarit est un G-code imprimé à l'échelle 1"></div>
    <div id="doublons-liste"></div>
    <div class="champ" style="display:flex; gap:10px">
      <div style="flex:1"><label>Type</label>
        <select id="n-type" style="width:100%; color:var(--ecume)">
          <option value="note">note — fragment, coin de table</option>
          <option value="idee">idee — affirmation</option>
          <option value="source">source — fiche de lecture</option>
          <option value="capture">capture</option>
        </select></div>
      <div style="flex:2"><label>Domaines (séparés par des virgules)</label>
        <input type="text" id="n-dom" placeholder="ex. : géométrie, bois"></div>
    </div>
    <div class="champ"><label>Corps (markdown)</label>
      <textarea id="n-corps" placeholder="le contenu — naître pauvre est de droit, relier est la vie"></textarea></div>
    <div class="boutons">
      <button class="btn primaire" id="n-ok">Créer</button>
      <button class="btn" id="n-annuler">Annuler</button>
      <span id="n-msg"></span>
    </div>
  </div>
</div>

<button id="panier-btn" title="panier">🧺<span class="nb" id="panier-nb"></span></button>
<div id="panier">
  <h3>Le panier</h3>
  <div id="panier-liste"></div>
  <textarea id="panier-q" placeholder="la question que tu poses au compagnon — il ne verra QUE ces passages"></textarea>
  <div class="pligne">
    <button class="btn primaire" id="p-synth">Synthèse</button>
    <button class="btn" id="p-ord">→ Ordonnance</button>
    <button class="btn" id="p-vider">Vider</button>
  </div>
  <span id="p-msg"></span>
</div>
<div id="toasts"></div>

<script>
"use strict";
const API = "";

/* ------------------------------------------------- état */
let DATA = null;            // {nodes, edges, etats, options, default}
let net = null, nodes = null, edges = null;
let eclairage = null;       // état du chantier courant
let modeRelier = null;      // null | titre de la fiche de départ
let ficheCourante = null;

/* ------------------------------------------------- utilitaires */
const $ = id => document.getElementById(id);
function echapper(s) { return String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(texte, err = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = texte;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
async function api(chemin, opts) {
  const r = await fetch(API + chemin, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erreur || r.statusText);
  return d;
}
function surligner(texte, mots) {
  let out = echapper(texte);
  for (const m of mots) {
    if (!m) continue;
    const re = new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, x => `<mark>${x}</mark>`);
  }
  return out;
}

/* ------------------------------------------------- carte */
function stylerNoeud(n, on, hit) {
  if (hit) return { id: n.id, size: n.size + 7,
    color: { background: "#ffd54f", border: "#ffd54f" },
    font: { color: "#0d1b2a", size: 30, bold: true } };
  return { id: n.id,
    size: on ? n.size : n.size_off,
    color: { background: on ? n.fond : "#1d2b3b", border: n.fond },
    font: { color: on ? "#dce8f5" : "#5d7183", size: on ? 26 : 17 } };
}
function stylerArete(e, litA, litB) {
  const points = { id: `${e.from}|${e.to}` };
  if (e.kind === "suggere")
    return { ...points, color: { color: "#e8a13c", opacity: 0.75 },
             width: 1.6, dashes: [4, 6] };
  const on = litA && litB;
  return { ...points, color: { color: "#8fa3b8", opacity: on ? 0.55 : 0.08 },
           width: on ? 1.6 : 0.7, hidden: false };
}
function appliquerEclairage() {
  const nom = $("casq").value;
  eclairage = DATA.etats[nom] || {};
  nodes.update(DATA.nodes.map(n => stylerNoeud(n, eclairage[n.id], false)));
  const parTitre = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
  edges.update(DATA.edges.map(e => stylerArete(e, eclairage[e.from], eclairage[e.to])));
  const nLit = DATA.nodes.filter(n => eclairage[n.id]).length;
  $("stat").textContent = `${nLit} éclairées / ${DATA.nodes.length}`;
}
async function chargerGraphe() {
  DATA = await api("/api/graphe");
  if (!net) {
    nodes = new vis.DataSet(DATA.nodes);
    edges = new vis.DataSet(DATA.edges);
    net = new vis.Network($("net"), { nodes, edges }, {
      physics: false,
      interaction: { hover: true, navigationButtons: true, keyboard: true },
      nodes: { font: { face: "Segoe UI" },
               shape: "dot", borderWidth: 1.5 },
    });
    net.fit({ animation: false });
    net.on("click", p => clicCarte(p));
  } else {
    nodes.clear(); edges.clear();
    nodes.add(DATA.nodes); edges.add(DATA.edges);
    net.fit({ animation: false });
  }
  if (!$("casq").options.length) {
    for (const [val, label] of DATA.options) {
      const o = document.createElement("option");
      o.value = val; o.textContent = label;
      $("casq").appendChild(o);
    }
  }
  $("casq").value = DATA.default;
  appliquerEclairage();
}

/* ------------------------------------------------- panneau fiche */
function wikilinksHtml(texte, mots) {
  // rend markdown puis transforme [[x]] en lien interne cliquable
  let html = marked.parse(texte);
  html = html.replace(/\[\[([^\]|]+?)(?:\|[^\]]*)?\]\]/g,
    (_m, t) => `<span class="lin" data-fiche="${echapper(t)}">${echapper(t)}</span>`);
  return html;
}
async function ouvrirFiche(titre, mots = []) {
  let f;
  try { f = await api(`/api/fiche?titre=${encodeURIComponent(titre)}`); }
  catch (e) { toast("fiche introuvable", true); return; }
  ficheCourante = f;
  const enCarte = DATA.nodes.some(n => n.id === titre);
  $("ptitre").textContent = titre;
  $("pmeta").innerHTML =
    `<span class="badge ${f.type}">${f.type}</span>` +
    `<span>${echapper(f.chemin)}</span>` +
    (f.source ? `<span class="badge">${echapper(f.source)}</span>` : "");
  $("pactions").innerHTML = `
    <button class="btn primaire" id="a-editer">Éditer</button>
    ${enCarte ? `<button class="btn" id="a-relier">Relier à…</button>` : ""}
    <button class="btn" id="a-panier" title="ajouter au panier">🧺 panier</button>`;
  const doms = f.domaines?.length
    ? f.domaines.map(d => `<span class="chip dom">${echapper(d)}</span>`).join("") : "";
  const lie = (f.lie || []).map(t => `
    <span class="chip" data-ouvrir="${echapper(t)}">${echapper(t)}
      <button class="vx" title="retirer le lien" data-del-lien="${echapper(t)}">×</button></span>`).join("");
  const sug = (f.suggere || []).map(t => `
    <span class="chip sug" data-ouvrir="${echapper(t)}">${echapper(t)}

  const docs = [];
  if (f.pdf) docs.push(`<a href="/pdf?p=${encodeURIComponent(f.pdf)}" target="_blank">${echapper(f.pdf)}</a>`);
  if (f.ouvrage) docs.push(`<span class="livre">${echapper(f.ouvrage)}</span>`);

  $("pcorps").querySelectorAll("[data-del-lien]").forEach(b => b.onclick = async e => {

    toast("lien retiré"); await recharger(f.titre);

  $("pcorps").querySelectorAll("[data-val-sug]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    await api("/api/suggere/valide", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a: f.titre, b: b.dataset.valSug }) });
    toast("suggestion validée"); await recharger(f.titre);
  });
  $("pcorps").querySelectorAll("[data-del-sug]").forEach(b => b.onclick = async e => {
    e.stopPropagation();

    toast("suggestion supprimée"); await recharger(f.titre);
  });
  if (mots.length) surlignerCorps(mots);
}
function surlignerCorps(mots) {
  const walk = n => {
    if (n.nodeType === 3) {
      const t = n.textContent;
      const html = surligner(t, mots);
      if (html !== echapper(t)) {
        const s = document.createElement("span"); s.innerHTML = html;
        n.replaceWith(s);
      }
    } else if (n.nodeType === 1 && !["CODE","PRE"].includes(n.tagName)) {
      [...n.childNodes].forEach(walk);
    }
  };
  walk($("md-corps"));
}
async function recharger(titre) {
  await chargerGraphe();
  await ouvrirFiche(titre);
}

function demarrerRelier(depart) {
  modeRelier = depart;   // titre, ou "__libre__" si pas encore de fiche ouverte
  $("mode").classList.add("on");
  toast(depart === "__libre__"
    ? "clique la fiche de départ"
    : `départ : ${depart} — clique l'arrivée`);
}
async function clicCarte(p) {
  if (!p.nodes.length) { if (modeRelier) annulerRelier(); return; }
  const titre = p.nodes[0];
  if (modeRelier === "__libre__") {
    modeRelier = titre;
    toast(`départ : ${titre} — clique l'arrivée`);
    return;
  }
  if (modeRelier) {
    if (titre === modeRelier) { annulerRelier(); return; }
    try {
      await api("/api/lien", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ a: modeRelier, b: titre }) });
      toast(`relié : ${modeRelier} ↔ ${titre}`);
      modeRelier = null; $("mode").classList.remove("on");
      await recharger(titre);
    } catch (e) { toast(e.message, true); annulerRelier(); }
    return;
  }
  await ouvrirFiche(titre);
}
function annulerRelier() { modeRelier = null; $("mode").classList.remove("on"); }

const LANGS = { rs: "rust", py: "python", js: "javascript", toml: "ini",
  md: "markdown", json: "json", txt: null, cs: null };

function wPdf(b) {
  const cite = b.corps ? `<div class="wcite">« ${echapper(b.corps)} »</div>` : "";
  const lien = b.ok
    ? `<a class="wlien" href="/pdf?p=${encodeURIComponent(b.chemin_pdf)}#page=${b.page}" target="_blank">ouvrir la page ${b.page} ↗</a>`
    : `<span style="color:var(--corail)">${echapper(b.erreur)}</span>`;
  return `<div class="wcart ${b.ok ? "" : "erree"}">
    <div class="wtype"><b>pdf</b> · ${echapper(b.attrs.doc || "")}</div>
    ${cite}<div class="wnote">${lien}</div></div>`;
}

function wFiche(b) {
  if (!b.ok) return `<div class="wcart erree"><div class="wtype"><b>fiche</b></div>
    <div class="wnote">${echapper(b.erreur)}</div></div>`;
  const f = b.fiche;
  return `<div class="wcart"><div class="wtype"><b>fiche</b> ·
      <span class="wlien" data-ouvrir-fiche="${echapper(f.titre)}">${echapper(f.titre)}</span></div>
    <div class="wcite">${wikilinksHtml((f.corps || "").slice(0, 600), [])}</div></div>`;
}

function wAutre(b) {
  const attrs = Object.entries(b.attrs).map(([k, v]) => `${k}: ${echapper(v)}`).join(" · ");
  return `<div class="wcart"><div class="wtype"><b>${echapper(b.type)}</b> · ${attrs}</div>
    <div class="wcite">${echapper(b.corps)}</div></div>`;
}

function idCode(chemin) { return "w-" + chemin.replace(/[^A-Za-z0-9]/g, "_"); }

function wCode(b) {
  if (!b.ok) return `<div class="wcart erree"><div class="wtype"><b>code</b></div>
    <div class="wnote">${echapper(b.erreur)}</div></div>`;
  const plages = b.plages || [];
  const pl = plages.length ? plages.map(([a, z]) => `${a}–${z}`).join(", ") : "fichier entier";
  return `<div class="wcode" id="${idCode(b.chemin_code)}">
    <div class="whead"><b>${echapper(b.chemin_code)}</b>
      <span>lignes ${pl}</span>
      <a class="wlien" href="/code?p=${encodeURIComponent(b.chemin_code)}" target="_blank">brut ↗</a></div>
    <div class="wscroll"></div>
    <div class="wzoom">grisé = hors sujet · ${plages.length} plage(s) en vie</div></div>`;
}

async function remplirCode(b) {
  const conteneur = document.getElementById(idCode(b.chemin_code));
  if (!conteneur) return;
  const scroll = conteneur.querySelector(".wscroll");
  const d = await api(`/api/codefile?depot=${encodeURIComponent(b.attrs.depot)}&chemin=${encodeURIComponent(b.attrs.chemin)}`);
  const lignes = d.texte.split("\n");
  const dans = i => (b.plages || []).some(([a, z]) => i + 1 >= a && i + 1 <= z);
  const lang = LANGS[(b.attrs.chemin.split(".").pop() || "").toLowerCase()] ?? null;
  const hl = window.hljs && lang ? t => hljs.highlight(t, { language: lang, ignoreIllegals: true }).value
    : t => echapper(t);
  const rouge = i => lignes[i] ?? "";
  let html = "<table>";
  const nMax = Math.min(lignes.length, 3000);
  for (let i = 0; i < nMax; i++) {
    const vie = dans(i);
    html += `<tr class="${vie ? "vie" : "dim"}"><td class="num">${i + 1}</td>` +
            `<td class="ligne">${hl(rouge(i)) || "&nbsp;"}</td></tr>`;
  }
  html += "</table>";
  scroll.innerHTML = html;
  const premiere = lignes.findIndex((_, i) => dans(i));
  if (premiere >= 0) {
    const tr = scroll.querySelectorAll("tr")[premiere];
    if (tr) tr.scrollIntoView({ block: "start" });
  }
}

  $("panel").classList.add("ouvert");

  const confier = $("o-confier");

        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nom, etat: "confiee" }) });
      toast(`ordonnance confiée → ${o.depot}/sessions/`);
      await ouvrirOrdonnance(nom);
    } catch (e) { toast(e.message, true); }

}

async function panierMaj() {

  panierBlocs = d.blocs;
  const nb = $("panier-nb");
  nb.style.display = panierBlocs.length ? "block" : "none";
  nb.textContent = panierBlocs.length;
  $("panier-liste").innerHTML = panierBlocs.map((b, i) => {
    const t = b.type === "pdf" ? `${b.attrs.doc || ""} p.${b.attrs.page || "?"}` :
              b.type === "code" ? `${b.attrs.chemin || ""} · ${b.attrs.lignes || "tout"}` :
              b.attrs.titre || "?";
    return `<div class="pitem"><span class="badge ${b.type}">${b.type}</span>
      <span class="t">${echapper(t)}</span>
      <button class="vx" data-pdel="${i}">×</button></div>`;
  }).join("") || '<p class="vide">vide — ajoute des passages depuis les fiches et les ordonnances</p>';
  $("panier-liste").querySelectorAll("[data-pdel]").forEach(b =>
    b.onclick = async () => {
      await api(`/api/panier?i=${b.dataset.pdel}`, { method: "DELETE" });
      panierMaj();
    });
}

async function ajouterPanier(bloc) {
  if (panierBlocs.some(b => idBloc(b) === idBloc(bloc))) { toast("déjà dans le panier"); return; }
  await api("/api/panier", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(bloc) });
  toast("ajouté au panier");
  panierMaj();
}

$("panier-btn").onclick = async () => {
  const el = $("panier");
  el.classList.toggle("on");
  if (el.classList.contains("on")) panierMaj();
};
$("p-vider").onclick = async () => { await api("/api/panier?tout=1", { method: "DELETE" }); panierMaj(); };
$("p-ord").onclick = async () => {
  if (!panierBlocs.length) { $("p-msg").textContent = "panier vide"; return; }
  try {
    const o = await api("/api/panier/ordonnance", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titre: "Panier du " + new Date().toLocaleDateString("fr-FR").replace(/\//g, "-"),
        chantier: $("casq").value, question: $("panier-q").value.trim() }) });
    toast("ordonnance préparée depuis le panier");
    $("panier").classList.remove("on");
    await ouvrirOrdonnance(o.nom);
  } catch (e) { $("p-msg").textContent = e.message; }
};
$("p-synth").onclick = () => lancerSynthese().catch(e => toast(e.message, true));

async function lancerSynthese() {
  const question = $("panier-q").value.trim();
  if (!question) { $("p-msg").textContent = "pose ta question au compagnon"; return; }
  $("panier").classList.remove("on");
  ficheCourante = null;
  $("ptitre").textContent = "Le compagnon";
  $("pmeta").innerHTML = '<span class="badge">synthèse du panier · brouillon</span>';
  $("pactions").innerHTML = "";
  $("pcorps").innerHTML = '<div class="sect"><div class="titre-sect">Brouillon — rien n\'est écrit dans le vault</div>' +
    '<div class="md" id="synthese"></div></div>';
  $("panel").classList.add("ouvert");
  const cible = $("synthese");
  let texte = "", pensee = "", dernierRendu = 0;
  const rendu = final => {
    let html = pensee ? `<div class="pensee">${echapper(pensee)}</div>` : "";
    html += marked.parse(texte);
    html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
      (_m, code) => `<div class="mermaid">${code}</div>`);
    cible.innerHTML = html + (final ? "" : ' <span style="color:var(--or)">▍</span>');
    if (final && window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: "neutral" });
      mermaid.run({ nodes: cible.querySelectorAll(".mermaid") }).catch(() => {});
    }
  };
  const rep = await fetch("/api/llm", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tache: "synthese", question }) });
  if (!rep.ok) { const e = await rep.json().catch(() => ({})); toast(e.erreur || "compagnon indisponible", true); return; }
  const lect = rep.body.getReader();
  const dec = new TextDecoder();
  let tampon = "";
  for (;;) {
    const { done, value } = await lect.read();
    if (done) break;
    tampon += dec.decode(value, { stream: true });
    let idx;
    while ((idx = tampon.indexOf("\n\n")) >= 0) {
      const evt = tampon.slice(0, idx);
      tampon = tampon.slice(idx + 2);
      if (!evt.startsWith("data: ")) continue;
      const charge = evt.slice(6);
      if (charge === "[DONE]") { rendu(true); continue; }
      try {
        const d = JSON.parse(charge);
        if (d.erreur) toast(d.erreur, true);
        else if (d.reflechit) { pensee += d.t; rendu(false); }
        else { texte += d.t; const t = performance.now();
          if (t - dernierRendu > 180) { rendu(false); dernierRendu = t; } }
      } catch (_) {}
    }
  }
  rendu(true);
  if (!texte.trim()) { cible.innerHTML = '<span class="vide">réponse vide</span>'; return; }
  $("pactions").innerHTML = '<button class="btn primaire" id="a-elever">Élever en note</button>';
  $("a-elever").onclick = () => {
    geneseCourante = "brouillon compagnon — synthèse de panier";
    $("n-titre").value = ""; $("n-corps").value = texte; $("n-dom").value = "";
    $("n-type").value = "note"; $("doublons-liste").innerHTML = ""; $("n-msg").textContent = "";
    $("voile").classList.add("on"); $("n-titre").focus();
  };
}
